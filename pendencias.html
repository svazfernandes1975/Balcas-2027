</style><div id="top"></div><nav class="pills" aria-label="Planejamento"><a href="index.html">← início</a><a href="pendencias.html" aria-current="page">Pendências</a></nav><div class="wrap"><div class="bk"><button type="button" class="back" data-back>← Voltar</button></div><div id="gx-sync" class="fbstrip" style="margin-top:10px"></div><section class="day"><div class="day-h"><span class="date">antes de ir</span><h2>Pendências</h2></div><ol class="tl" id="todo"><li class="k-warn" style="grid-template-columns:28px minmax(0,1fr)"><input type="checkbox" id="td10" data-i="10" aria-label="feito"><div><label for="td10" style="color:var(--ink)">Renovar os passaportes, o português e o brasileiro. Precisam ter validade de pelo menos 3 meses depois de 05/06/2027 (saída do espaço Schengen) e páginas livres. Passaporte leva semanas: comece logo.</label></div></li><li class="k-warn" style="grid-template-columns:28px minmax(0,1fr)"><input type="checkbox" id="td11" data-i="11" aria-label="feito"><div><label for="td11" style="color:var(--ink)">Tirar a PID (Permissão Internacional para Dirigir), a carteira internacional. Leve junto com a CNH.</label></div></li><li class="k-warn" style="grid-template-columns:28px minmax(0,1fr)"><input type="checkbox" id="td12" data-i="12" aria-label="feito"><div><label for="td12" style="color:var(--ink)">Ficha do seguro viagem: contratar, preencher e guardar a apólice, o telefone de assistência 24 h e o cartão do seguro, impressos e no celular. Os dados vão também no <a href="dossie.html">Dossiê de imigração</a>.</label></div></li><li class="k-tip" style="grid-template-columns:28px minmax(0,1fr)"><input type="checkbox" id="td13" data-i="13" aria-label="feito"><div><label for="td13" style="color:var(--ink)">Imprimir os documentos: passagens (e-ticket), vouchers dos hotéis, contrato da Nova Rent a Car, apólice do seguro, PID, CNH e o <a href="dossie.html">Dossiê de imigração</a>. Leve também cópia digital no celular.</label></div></li><li class="k-warn" style="grid-template-columns:28px minmax(0,1fr)"><input type="checkbox" id="td2" data-i="2" aria-label="feito"><div><label for="td2" style="color:var(--ink)">Acompanhar o início do ETIAS (autorização online, cerca de €20,00). Se estiver valendo antes de maio de 2027, a Andréa precisa fazer o pedido no site oficial da UE antes de embarcar. Sergio usa o passaporte português.</label></div></li><li class="k-drive" style="grid-template-columns:28px minmax(0,1fr)"><input type="checkbox" id="td4" data-i="4" aria-label="feito"><div><label for="td4" style="color:var(--ink)">Comprar a e-vinheta da Eslovênia (classe 2A, €16,00/7 dias) em 18/05 com a placa do carro.</label></div></li><li class="k-tip" style="grid-template-columns:28px minmax(0,1fr)"><input type="checkbox" id="td5" data-i="5" aria-label="feito"><div><label for="td5" style="color:var(--ink)">Conferir se o sistema Crolibertas (pedágio croata sem cabine) já está ativo em 2027.</label></div></li><li class="k-tip" style="grid-template-columns:28px minmax(0,1fr)"><input type="checkbox" id="td6" data-i="6" aria-label="feito"><div><label for="td6" style="color:var(--ink)">Em 21/05, antes de sair de Ljubljana, comprar o piquenique de Plitvice (pão, queijo duro, salame seco, frutas, castanhas, água, e fatiado ou com uma faquinha, que volta na mala despachada), porque 22/05 será um dia inteiro no parque.</label></div></li><li class="k-warn" style="grid-template-columns:28px minmax(0,1fr)"><input type="checkbox" id="td9" data-i="9" aria-label="feito"><div><label for="td9" style="color:var(--ink)">Voos: marcar assentos nos trechos Lufthansa (LH 1406, 1405 e 918) e conferir terminais e tempos de conexão em Frankfurt (1h25 na volta) e Heathrow (2h40).</label></div></li></ol></section><p class="foot">Balcãs 2027 · roteiros atualizados ao longo do planejamento. Valores de ingressos, pedágios e horários são estimativas a confirmar nos sites oficiais.</p><div class="bk bk-end"><button type="button" class="back" data-back>← Voltar</button></div></div><script>
(function(){var K='balcas2027-todo',s={};try{s=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
var boxes=[].slice.call(document.querySelectorAll('#todo input'));
function paint(){boxes.forEach(function(c){c.checked=!!s[c.dataset.i]})}
function keep(){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}
paint();
var ready=false;
boxes.forEach(function(c){c.addEventListener('change',function(){s[c.dataset.i]=c.checked;keep();
  if(ready&&window.FB){var o={};o[c.dataset.i]=c.checked;FB.set('data/todo',{done:o},true)}})});
function bind(){if(!window.FB)return;
  var el=document.getElementById('gx-sync');if(el)FB.strip(el);
  var unsub=null;
  FB.onAuth(function(u){if(unsub){unsub();unsub=null}ready=false;if(!u)return;
    unsub=FB.watchDoc('todo','data/todo',function(d,meta){
      var r=(d&&d.done)||{},miss={},n=0;
      Object.keys(r).forEach(function(k){s[k]=!!r[k]});
      Object.keys(s).forEach(function(k){if(!(k in r)){miss[k]=s[k];n++}});
      keep();paint();ready=true;
      if(n&&!meta.fromCache)FB.set('data/todo',{done:miss},true)})})}
if(window.FB)bind();else{document.addEventListener('fb-ready',bind);setTimeout(function(){var el=document.getElementById('gx-sync');if(!window.FB&&el)el.textContent='☁ Salvo só neste aparelho (Firebase indisponível)'},4000)}})();
</script>
