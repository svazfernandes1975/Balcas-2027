<script>
var DEF=[{"id": "10", "t": "Renovar os passaportes, o português e o brasileiro. Precisam ter validade de pelo menos 3 meses depois de 05/06/2027 (saída do espaço Schengen) e páginas livres. Passaporte leva semanas: comece logo.", "k": "warn", "m": "2026-12", "c": "docs"}, {"id": "11", "t": "Tirar a PID (Permissão Internacional para Dirigir), a carteira internacional. Leve junto com a CNH.", "k": "warn", "m": "2027-03", "c": "docs"}, {"id": "12", "t": "SEGURO VIAGEM: já emitido em 25/11/2026 (seguro do cartão Visa Infinite, AIG, para Sérgio e Andréa, válido até 25/11/2027). Salvar os dois certificados em PDF no celular, imprimir (veja IMPRIMIR TUDO) e conferir os telefones e os passos de reembolso no [SOS](sos.html). Os dados vão também no [Dossiê de imigração](dossie.html).", "k": "warn", "m": "2027-03", "c": "docs"}, {"id": "s-condicoes", "t": "SEGURO VIAGEM: ler as condições gerais no site da Visa (visa.com.br/portaldebeneficios), principalmente o que fica de fora: doenças pré-existentes, esportes de aventura, acidentes com veículo e bagagem deixada no carro. Dúvida? Ligue para a central antes de viajar.", "k": "tip", "m": "2027-03", "c": "docs"}, {"id": "d-embaixadas", "t": "DOCUMENTOS: confirmar no site do Itamaraty (Portal Consular) os telefones e o plantão consular das representações do Brasil que o [SOS](sos.html) lista (Zagreb, Liubliana, Belgrado, Sarajevo e Frankfurt), e salvar os números no celular. Os dados do SOS vêm de diretórios, e o endereço de Liubliana tem fontes divergentes.", "k": "tip", "m": "2027-04", "c": "docs"}, {"id": "s-fone", "t": "SEGURO VIAGEM: salvar na agenda do celular os telefones da central do seguro (fora do Brasil: +1 303 967 1098, a cobrar; do Brasil: 0800 891 3679). Em emergência, ligue antes para o 112.", "k": "tip", "m": "2027-04", "c": "docs"}, {"id": "p-imprimir", "t": "IMPRIMIR TUDO: até 10/05, imprimir uma pasta de papel com os documentos da viagem e salvar o PDF de cada um no celular. Inclua: o [Dossiê de imigração](dossie.html) já preenchido (botão Imprimir / salvar em PDF) e o [Livro da viagem](livro.html) como referência do roteiro; a [Checklist da locação](locacao.html) e o [SOS](sos.html); passagens (e-ticket) e cartões de embarque; vouchers dos hotéis e dos Airbnb; voucher da Alamo (Rentcars), certificado e política da Rentalcover e o print da conversa com a Alamo; apólice e telefones do seguro viagem; cópia dos passaportes, da CNH e da PID; ingressos já comprados. Leve uma segunda via do Dossiê separada da pasta.", "k": "warn", "m": "2027-05", "c": "docs", "d": "2027-05-10"}, {"id": "d-familiar", "t": "DOCUMENTOS: deixar com um familiar no Brasil uma cópia digital do roteiro, dos hotéis, dos passaportes, do seguro e do contrato do carro, e combinar um contato de emergência. O [Dossiê de imigração](dossie.html) pode servir de base.", "k": "tip", "m": "2027-05", "c": "docs", "d": "2027-05-12"}, {"id": "2", "t": "Acompanhar o início do ETIAS (autorização online, cerca de €20,00). Se estiver valendo antes de maio de 2027, a Andréa precisa fazer o pedido no site oficial da UE antes de embarcar. Sérgio usa o passaporte português.", "k": "warn", "m": "2027-03", "c": "docs"}, {"id": "4", "t": "Comprar a e-vinheta da Eslovênia (classe 2A, €16,00/7 dias) em 18/05 com a placa do carro.", "k": "drive", "m": "2027-05", "c": "carro"}, {"id": "5", "t": "Conferir se o sistema Crolibertas (pedágio croata sem cabine) já está ativo em 2027.", "k": "tip", "m": "2027-04", "c": "carro"}, {"id": "6", "t": "Em 21/05, antes de sair de Ljubljana, comprar o piquenique de Plitvice (pão, queijo duro, salame seco, frutas, castanhas, água, e fatiado ou com uma faquinha, que volta na mala despachada), porque 22/05 será um dia inteiro no parque.", "k": "tip", "m": "2027-05", "c": "preparo"}, {"id": "9", "t": "Marcar os assentos nos voos da Lufthansa (LH 1406 em 15/05 e LH 1405 em 05/06), que não vieram no e-ticket. Conferir na reserva da LATAM se os assentos Espaço+ 13F e 13H aparecem na ida e na volta. Conexões em Frankfurt: 5h50 na ida e 4h25 na volta.", "k": "warn", "m": "2027-02", "c": "voos"}, {"id": "mk-cancel", "t": "Cancelar a reserva do MK Luxury Rooms (Split) na Booking. Cancelamento grátis até 17/05/2027 (23:59). A hospedagem oficial em Split é o apartamento do Ivan (Airbnb).", "k": "warn", "m": "2027-05", "c": "hoteis", "d": "2027-05-17"}, {"id": "car1", "t": "Carro: reserva da Alamo confirmada na Rentcars (retirada 18/05 às 11:00 e devolução 05/06 às 11:00, no aeroporto de Zagreb). O chat com a Alamo em 24/11 confirmou as taxas de fronteira (€40 UE + €60 fora da UE, €100 no total) e a caução de €1.100. Falta a franquia exata e ver tudo escrito no contrato. Ver [Dirigir, Meu carro alugado](dirigir.html#aluguel).", "k": "warn", "m": "2026-11", "c": "carro"}, {"id": "car-nova", "t": "LEMBRETE: cancelar a reserva da Nova Rent a Car. A Alamo (Rentcars) já está confirmada e paga. Antes, veja a política e o prazo de cancelamento grátis da Nova, cancele pelo mesmo canal em que reservou, guarde o e-mail de confirmação do cancelamento e confira o estorno no cartão.", "k": "warn", "m": "2026-11", "c": "carro"}, {"id": "car2", "t": "Rentalcover: o suporte respondeu em 24/11 que a proteção vale nos países do certificado se a Alamo autorizar a fronteira no contrato. O reembolso se pede pela Conta Rentalcover o mais breve possível, e em dano leve vale a documentação da Alamo no lugar do boletim. Falta ver a lista de países na sua Conta Rentalcover (o PDF vem em branco) e guardar o print. Ver [Dirigir, Meu carro alugado](dirigir.html#aluguel).", "k": "warn", "m": "2027-03", "c": "carro"}, {"id": "car3", "t": "Confirmar com a Alamo, por e-mail ou telefone: horário do balcão em Zagreb em 18/05 (retirada às 11:00, com tolerância de 29 minutos) e em 05/06 (devolução às 11:00), Andréa como condutora adicional (hoje só o Sérgio consta no voucher), carta verde, franquia exata e se a CNH brasileira com PID é aceita. Já confirmado no chat de 24/11: taxas de fronteira (€100) e caução de €1.100. Levar cartão de crédito físico, internacional e em nome do condutor, com limite para a caução (não aceitam pré-pago, virtual ou por aproximação, e podem recusar banco digital), e a CNH física original: a CNH digital não vale fora do Brasil. Conferir se o cartão tem cobertura de aluguel.", "k": "drive", "m": "2027-04", "c": "carro"}, {"id": "car-chk", "t": "Ler a [Checklist da locação](dirigir.html#checklist) e salvá-la para usar offline, junto com o print do chat da Alamo de 24/11 (atendente Marketta). No balcão, conferir por escrito: autorização para Eslovênia, Itália, Montenegro e Bósnia, taxas de fronteira (€100) pagas, carta verde, franquia e a vinheta eslovena.", "k": "warn", "m": "2027-04", "c": "carro"}, {"id": "ing-plitvice", "t": "INGRESSO a comprar antes: Parque Nacional de Plitvice, 22/05 (sábado). Compre no [site oficial](https://ticketing.np-plitvicka-jezera.hr) escolhendo a Entrada 2 e um horário cedo. €23 por adulto, €46 para 2 (tabela 2026; conferir a de 2027). O ingresso só vale na entrada e no horário comprados. Reembolso opcional: +€5.", "k": "warn", "m": "2027-03", "c": "ingressos"}, {"id": "ing-postojna", "t": "INGRESSO a comprar antes: Gruta de Postojna + Castelo de Predjama (combo com Expo), 20/05. €55 por adulto, €110 para 2 (conferir). Compre no [site oficial](https://tickets.postojnska-jama.eu/en/postojna-cave-predjama-castle-expo/pack-440.html) o primeiro horário da manhã. Troca de horário é grátis até 24 h antes.", "k": "warn", "m": "2027-04", "c": "ingressos"}, {"id": "ing-krka", "t": "INGRESSO a comprar antes (opcional): Parque Nacional Krka, Skradinski buk, 02/06, com o ônibus do parque. €30 por adulto depois das 15h e €40 antes (tabela 2027 conferida), €60 a €80 para 2. Compre em [npkrka.hr](https://npkrka.hr) só se decidir ir a Krka em vez da Fortaleza de São Nicolau.", "k": "warn", "m": "2027-04", "c": "ingressos"}, {"id": "ing-muralhas", "t": "INGRESSO, online ou nos portões: Muralhas de Dubrovnik + Forte Lovrijenac, 27/05. €40 por adulto (vale 72 h), €80 para 2. Compre na [loja oficial](https://shop.citywallsdubrovnik.hr/en) ou nos portões; revendedores cobram 25% a 40% a mais.", "k": "drive", "m": "2027-05", "c": "ingressos"}, {"id": "ing-bled", "t": "INGRESSO, online ou na bilheteria: Castelo de Bled, 19/05. €19 por adulto, €38 para 2. Compre no [site oficial](https://www.blejski-grad.si); desconto só na bilheteria.", "k": "drive", "m": "2027-05", "c": "ingressos"}, {"id": "ing-lj", "t": "INGRESSO, online ou na hora: Castelo de Ljubljana, 18/05, com o funicular da Krekov trg. ≈ €15 + funicular ≈ €6 por adulto (a confirmar). Veja no [site oficial](https://www.ljubljanskigrad.si).", "k": "drive", "m": "2027-05", "c": "ingressos"}, {"id": "ing-rastoke", "t": "INGRESSO, online ou na hora (opcional): Rastoke, circuito Vodene Tajne, 03/06. €5 por adulto, €10 para 2 (tarifa de 2026). Compre na [loja de Slunj](https://webshop.slunj.hr/en); os quiosques só aceitam cartão.", "k": "drive", "m": "2027-05", "c": "ingressos"}, {"id": "ing-zagreb", "t": "INGRESSO, online ou na hora: Museu das Relações Rompidas, Zagreb, 16/05. ≈ €10 a €12 por adulto. Veja em [brokenships.com](https://brokenships.com).", "k": "drive", "m": "2027-05", "c": "ingressos"}, {"id": "ing-hora-bled", "t": "INGRESSO, pagar na hora: Pletna, barco até a ilha de Bled, 19/05. ≈ €20 por adulto, €40 para 2, no cais do lago (confirmar horário e pagamento).", "k": "tip", "m": "2027-05", "c": "ingressos"}, {"id": "ing-hora-plitvice", "t": "INGRESSO, pagar na hora (opcional): Smiljan, terra de Tesla, 23/05. ≈ €8 a €10 por adulto, na bilheteria.", "k": "tip", "m": "2027-05", "c": "ingressos"}, {"id": "ing-hora-split", "t": "INGRESSOS, pagar na hora, em Split (opcionais): Porões do Palácio de Diocleciano (24/05, ≈ €10 por adulto), Catedral de São Domnius + campanário (24/05, ≈ €7 a €10) e Fortaleza de Klis (25/05, ≈ €12).", "k": "tip", "m": "2027-05", "c": "ingressos"}, {"id": "ing-hora-cavtat", "t": "INGRESSO, pagar na hora (opcional): Mausoléu Račić, em Cavtat, 28/05. ≈ €3 a €5 por adulto (as fontes divergem), no cemitério.", "k": "tip", "m": "2027-05", "c": "ingressos"}, {"id": "ing-hora-kotor", "t": "INGRESSOS, pagar na hora, em Kotor (todos opcionais): Catedral de São Trifão (29/05, ≈ €4 por adulto), barco a Nossa Senhora das Rochas (30/05, ≈ €5, no cais de Perast), Parque Lovćen (30/05, €3), Mausoléu de Njegoš (30/05, €8), Muralhas e Fortaleza de São João (31/05, €15 ou €8, só dinheiro) e Museu Marítimo (31/05, ≈ €4).", "k": "tip", "m": "2027-05", "c": "ingressos"}, {"id": "ing-hora-sibenik", "t": "INGRESSOS, pagar na hora, em Šibenik, 02/06: Catedral de São Tiago (obrigatória, ≈ €5 por adulto, confirmar). Opcional: Fortaleza de São Nicolau (€27,50 por adulto).", "k": "tip", "m": "2027-05", "c": "ingressos"}, {"id": "h-astoria", "t": "HOTEL · Zagreb: Best Western Premier Hotel Astoria, 15–18/05 (3 noites, €315, pago no hotel). Cancelamento grátis até 13/05/2027, 23:59. Até lá, confirme que mantém a reserva; se o plano mudar, cancele na Booking.", "k": "warn", "m": "2027-05", "c": "hoteis", "d": "2027-05-13"}, {"id": "h-lj", "t": "HOTEL · Ljubljana: Central Apartments with Parking, 18–21/05 (3 noites, €425, pago no hotel). Cancelamento grátis até 12/05/2027, 23:59. A reserva não permite alterar datas.", "k": "warn", "m": "2027-05", "c": "hoteis", "d": "2027-05-12"}, {"id": "h-plitvice", "t": "HOTEL · Plitvice: Tesla's Gastro House Plitvice, 21–23/05 (2 noites, €313, pago no hotel). Cancelamento grátis só até 06/05/2027, 23:59: um dos prazos mais curtos.", "k": "warn", "m": "2027-05", "c": "hoteis", "d": "2027-05-06"}, {"id": "h-ivan-pg", "t": "PAGAMENTO DO HOTEL · Split: o Airbnb debita €270 em 01/05/2027 (apartamento do Ivan, 23–26/05). Deixe limite no cartão.", "k": "warn", "m": "2027-05", "c": "hoteis", "d": "2027-05-01"}, {"id": "h-ivan-c", "t": "HOTEL · Split: Apartamento do Ivan (Airbnb), 23–26/05. Cancelamento grátis até 09/05/2027 às 14:00, com reembolso integral. Até 16/05 às 14:00 o reembolso é de 50% das noites; depois, nenhum.", "k": "warn", "m": "2027-05", "c": "hoteis", "d": "2027-05-09"}, {"id": "h-mery-pg", "t": "PAGAMENTO DO HOTEL · Dubrovnik: o Airbnb debita €393 em 18/04/2027 (Mery Room 1, 26–29/05). Deixe limite no cartão.", "k": "warn", "m": "2027-04", "c": "hoteis", "d": "2027-04-18"}, {"id": "h-mery-c", "t": "HOTEL · Dubrovnik: Mery Room 1 (Airbnb), 26–29/05. Cancelamento grátis só até 26/04/2027, o prazo mais curto de todas as hospedagens. O débito de €393 acontece antes, em 18/04.", "k": "warn", "m": "2027-04", "c": "hoteis", "d": "2027-04-26"}, {"id": "h-kotor", "t": "HOTEL · Kotor: Marea DeLuxe Apartments, 29/05–01/06 (3 noites, €370, pago no hotel). Cancelamento grátis até 21/05/2027, 23:59. A reserva não permite alterar datas.", "k": "warn", "m": "2027-05", "c": "hoteis", "d": "2027-05-21"}, {"id": "h-olympia", "t": "HOTEL · Šibenik/Vodice: Hotel Olympia Sky, 01–03/06 (2 noites, €474, pago no hotel). Cancelamento grátis até 26/05/2027, 23:56. Confirme também se a piscina estará aberta em 01–03/06.", "k": "warn", "m": "2027-05", "c": "hoteis", "d": "2027-05-26"}, {"id": "h-rastoke", "t": "HOTEL · Rastoke: Hotel Mirjana & Rastoke, 03–04/06 (1 noite, €115, pago no hotel). Cancelamento grátis até 26/05/2027, 23:59.", "k": "warn", "m": "2027-05", "c": "hoteis", "d": "2027-05-26"}, {"id": "h-capital", "t": "HOTEL · Zagreb: Hotel Capital (Amadria Park), 04–05/06 (1 noite, €159, pago no hotel). Cancelamento grátis até 01/06/2027, 23:59.", "k": "warn", "m": "2027-06", "c": "hoteis", "d": "2027-06-01"}, {"id": "h-riverside", "t": "HOTEL · Ljubljana: conferir na Booking se ainda existe outra reserva (Villa Riverside) e, se existir, cancelar, para não ficar com duas hospedagens na mesma data.", "k": "tip", "m": "2026-12", "c": "hoteis"}, {"id": "h-ivan-ac", "t": "HOTEL · Split: perguntar ao Ivan se há ar-condicionado (não consta no anúncio) e combinar o check-in. Os detectores de fumaça e de monóxido constam como indisponíveis.", "k": "tip", "m": "2027-04", "c": "hoteis"}, {"id": "h-placa", "t": "HOTEL · Dubrovnik: pedir à anfitriã (Antonia) que registre a placa do carro, porque o acesso ao redor da cidade velha é restrito de março a novembro. Faça depois de pegar o carro, em 18/05.", "k": "tip", "m": "2027-05", "c": "hoteis"}, {"id": "f-checkin", "t": "VOOS: fazer o check-in online da ida (LATAM LA 8070, GRU–FRA, 14/05 às 23:40) e da Lufthansa (LH 1406, 15/05). Confira no app de cada companhia quando abre e salve os cartões de embarque no celular.", "k": "warn", "m": "2027-05", "c": "voos", "d": "2027-05-13"}, {"id": "f-app", "t": "VOOS: conferir no app da LATAM o itinerário e os assentos, porque a volta já foi alterada uma vez (21/10/2026). Guarde prints com data. O histórico e os protocolos estão em [Voos](voos.html).", "k": "warn", "m": "2027-03", "c": "voos"}, {"id": "f-transfer", "t": "VOOS · Transfer em Zagreb (reservado e pago, € 34,50): antes de viajar, abra o app da Booking para ver a política de cancelamento, salve o voucher e as instruções do ponto de encontro off-line e deixe roaming ou eSIM ativo ao pousar, porque o motorista liga para o seu número do Brasil. Se o horário do LH 1406 mudar, confira no app que a corrida acompanhou. Ver [Zagreb, chegada](zagreb.html).", "k": "tip", "m": "2027-05", "c": "voos"}, {"id": "d-dossie", "t": "DOCUMENTOS: anotar no [Dossiê de imigração](dossie.html) o número do contrato da Alamo, depois da retirada do carro em 18/05.", "k": "tip", "m": "2027-05", "c": "docs"}, {"id": "d-dossie-fill", "t": "DOCUMENTOS: preencher o [Dossiê de imigração](dossie.html) com passaportes, seguro, endereços dos hotéis e contatos, antes de imprimir. O que você digita fica só neste aparelho, então preencha no aparelho de onde vai imprimir ou gerar o PDF.", "k": "tip", "m": "2027-05", "c": "docs", "d": "2027-05-08"}, {"id": "m-meios", "t": "DINHEIRO: conferir o \"Falta cobrir\" no [Orçamento](gastos.html?aba=orcamento) e carregar os meios (Wise, Nomad, C6 e dinheiro em espécie) com euros antes de viajar. Leve euros em espécie para estacionamentos e fortalezas.", "k": "warn", "m": "2027-04", "c": "dinheiro"}, {"id": "m-bancos", "t": "DINHEIRO: avisar os bancos e os cartões sobre a viagem, conferir o limite internacional e deixar folga para a caução do carro (€1.100), os hotéis pagos no local e os débitos do Airbnb. Leve o cartão de crédito físico, internacional e em nome do condutor.", "k": "warn", "m": "2027-04", "c": "dinheiro"}, {"id": "m-taxa", "t": "DINHEIRO: conferir nas reservas (Booking e Airbnb) se a taxa turística está incluída no preço. Se não estiver, ela costuma ser cobrada no local, então leve euros em espécie para pagá-la em cada cidade.", "k": "tip", "m": "2027-04", "c": "dinheiro"}, {"id": "p-esim", "t": "PREPARO: comprar um eSIM ou chip europeu com cobertura na Croácia, Eslovênia, Itália e Montenegro (e Bósnia, se passar por Neum). Montenegro e Bósnia não são da UE, então confira se o plano cobre. Instale antes de embarcar.", "k": "tip", "m": "2027-04", "c": "preparo"}, {"id": "p-remedios", "t": "PREPARO: separar remédios de uso contínuo e um kit básico de viagem na bagagem de mão, com a receita ou o nome genérico. Veja o [Checklist de mala](mala.html).", "k": "tip", "m": "2027-04", "c": "preparo"}, {"id": "p-mala", "t": "PREPARO: pesar e arrumar as malas com o [Checklist de mala](mala.html). Plano: ida só com bagagem de mão. Nos voos da Lufthansa (15/05 e 05/06), por pessoa: 1 bagagem de mão de até 8 kg (55×40×23 cm) e 1 objeto pessoal de até 40×30×15 cm. Na volta, despachar uma mala de até 23 kg, com a mala dobrável cheia.", "k": "tip", "m": "2027-05", "c": "preparo"}, {"id": "p-mapas", "t": "PREPARO: baixar mapas offline (Google Maps) de cada cidade e das rotas, e instalar os aplicativos que vai usar (Bolt ou Uber, bancos, companhias aéreas).", "k": "tip", "m": "2027-05", "c": "preparo"}, {"id": "p-aeroporto", "t": "PREPARO: combinar o transporte até Guarulhos na ida (LA 8070, 14/05 às 23:40; chegue com cerca de 3 horas de antecedência) e o transporte para casa na chegada, na volta.", "k": "tip", "m": "2027-05", "c": "preparo"}, {"id": "r-zagreb", "t": "RESTAURANTE · Zagreb: reservar o Vinodol para domingo, 16/05 (confirme o horário de domingo).", "k": "tip", "m": "2027-05", "c": "restaurantes"}, {"id": "r-lj", "t": "RESTAURANTE · Ljubljana: reservar o Pri Škofu (18/05, poucas mesas) e, em Trieste, o Al Bagatto (20/05, reserve ao menos 1h30 antes da volta).", "k": "tip", "m": "2027-05", "c": "restaurantes"}, {"id": "r-plitvice", "t": "RESTAURANTE · Plitvice: reservar o Etno Restoran Degenija para sábado, 22/05, em restaurantdegenija.com.", "k": "tip", "m": "2027-05", "c": "restaurantes"}, {"id": "r-split", "t": "RESTAURANTE · Split: reservar o Bokeria (domingo, 23/05, confirme o horário), o Konoba Fetivi (24/05, fecha aos domingos) e o Konoba Matejuška (25/05, fecha às segundas).", "k": "tip", "m": "2027-05", "c": "restaurantes"}, {"id": "r-dubrovnik", "t": "RESTAURANTE · Dubrovnik: reservar o Pantarul para 28/05 e ir de Uber ou Bolt. Se preferir o Nautika (jantar com vista), reserve com semanas de antecedência.", "k": "tip", "m": "2027-04", "c": "restaurantes"}, {"id": "r-kotor", "t": "RESTAURANTE · Kotor: reservar o Galion para sábado, 29/05 (faixa de preço a confirmar).", "k": "tip", "m": "2027-05", "c": "restaurantes"}, {"id": "r-vodice", "t": "RESTAURANTE · Vodice: perguntar se o Restaurant Sky, no 10º andar do Olympia Sky, abre para quem não está em meia-pensão e reservar para 02/06.", "k": "tip", "m": "2027-05", "c": "restaurantes"}];

try{s=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}

function defC(){return{ts:0,items:DEF.map(function(x){return{id:x.id,t:x.t,k:x.k,m:x.m||'',c:x.c||'outros',d:x.d||''}})}}
