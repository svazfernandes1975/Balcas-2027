function brl(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0)}
function n1(v){return (Math.round(v*10)/10).toLocaleString('pt-BR')}
function dl(d){var p=d.split('-'),x=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));return new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(x)}
function wd(d){var p=d.split('-'),x=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));return new Intl.DateTimeFormat('pt-BR',{weekday:'long',timeZone:'UTC'}).format(x)}
function stars(n){var s='',f=Math.floor(n||0);for(var i=0;i<f;i++)s+='★';if((n||0)-f>=.5)s+='½';return s}
function hm(ts){return String(ts).slice(11,16).replace(':','h')}
function where(c){var a=c.city,b=c.country;if(!a&&!b&&c.addr){var p=c.addr.split(',').map(function(x){return x.trim()}).filter(Boolean);if(p.length>=2){b=p[p.length-1];a=p[p.length-2]}}return {city:a||'',country:b||'',txt:[a,b].filter(Boolean).join(', ')}}
function hav(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function dist(k){return k<1?Math.round(k*1000)+' m':n1(k)+' km'}
function ms(ts){var t=new Date(String(ts).replace(' ','T')+(String(ts).length<=16?':00':'')).getTime();return isNaN(t)?0:t}
function dur(min){if(min<1)return 'menos de 1 min';var h=Math.floor(min/60),m=Math.round(min%60);return h?h+'h'+(m?(m<10?'0':'')+m:''):m+' min'}
function label(r){return r>=4.5?'imperdível':r>=3.5?'muito bom':r>=2.5?'bom':r>=1.5?'regular':'fraco'}
function ord(n){return n+'º'}
function gastos(){var S=null;try{S=JSON.parse(localStorage.getItem('balcas2027-gastos-v1')||'null')}catch(e){}return S&&S.entries?S:{entries:[],cats:[]}}

/* curiosidades da Wikipédia (por proximidade), guardadas no aparelho para o livro abrir offline */
var wiki={};try{wiki=JSON.parse(localStorage.getItem(WK)||'{}')||{}}catch(e){}
function saveWiki(){try{localStorage.setItem(WK,JSON.stringify(wiki))}catch(e){}}
function jget(u){return fetch(u).then(function(r){if(!r.ok)throw new Error('http');return r.json()})}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function similar(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;if(a.indexOf(b)>-1||b.indexOf(a)>-1)return true;var A=a.split(' ').filter(function(w){return w.length>3}),B=b.split(' ');return A.some(function(w){return B.indexOf(w)>-1})}
function cut(t,n){t=String(t||'').replace(/\s+/g,' ').trim();if(t.length<=n)return t;var s=t.slice(0,n),i=Math.max(s.lastIndexOf('. '),s.lastIndexOf('! '));return i>120?s.slice(0,i+1):s.replace(/\s+\S*$/,'')+'…'}
function fetchWiki(c,lang){
 var base='https://'+lang+'.wikipedia.org/w/api.php?format=json&origin=*&';
 return jget(base+'action=query&list=geosearch&gscoord='+c.lat+'%7C'+c.lon+'&gsradius=300&gslimit=8').then(function(j){
  var l=(j.query&&j.query.geosearch)||[];if(!l.length)return null;
  var pick=l.filter(function(x){return similar(x.title,c.name)})[0]||l[0];if(!similar(pick.title,c.name)&&(pick.dist||0)>120)return null;
  return jget(base+'action=query&prop=extracts%7Cinfo&exintro=1&explaintext=1&exsentences=4&inprop=url&pageids='+pick.pageid).then(function(e){
   var pg=e.query&&e.query.pages&&e.query.pages[pick.pageid];if(!pg||!pg.extract)return null;
   return {t:pg.title,x:cut(pg.extract,520),u:pg.fullurl||'',l:lang,d:Math.round(pick.dist||0),m:similar(pick.title,c.name)?1:0}})})}
var queue=[],busy=false;
function pump(){if(busy||!queue.length)return;busy=true;var c=queue.shift();
 fetchWiki(c,'pt').then(function(r){return r||fetchWiki(c,'en')}).then(function(r){wiki[c.id]=r||{none:1,ts:Date.now()};saveWiki();paintWiki(c.id)},function(){/* sem internet: tenta de novo na próxima vez */}).then(function(){busy=false;pump()})}
function wikiHtml(id){var w=wiki[id];if(!w||w.none)return '';
 return '<div class="lv-wk"><b>Você sabia?</b> '+esc(w.x)+'<div class="src">Perto dali, na Wikipédia'+(w.l==='en'?' (em inglês)':'')+': <a href="'+esc(w.u)+'" target="_blank" rel="noopener">'+esc(w.t)+'</a>'+(w.m?'':' · artigo mais próximo, pode não ser o mesmo lugar')+' · texto sob CC BY-SA</div></div>'}
function paintWiki(id){var el=document.querySelector('[data-wk="'+id+'"]');if(el)el.innerHTML=wikiHtml(id)}

function render(){
 var el=document.getElementById('lv'),S=gastos(),cn={};(S.cats||[]).forEach(function(c){cn[c.id]=c.name});
 var cks=(window.CK?CK.list():[]).slice().sort(function(a,b){return String(a.ts)<String(b.ts)?-1:1});
 var gs=S.entries.filter(function(e){return e.t==='g'&&e.date>=T0&&e.date<=T1});
 var days={};
 cks.forEach(function(c){(days[c.date]=days[c.date]||{ck:[],g:[]}).ck.push(c)});
 gs.forEach(function(e){(days[e.date]=days[e.date]||{ck:[],g:[]}).g.push(e)});
 var ks=Object.keys(days).sort();
 if(!ks.length){el.innerHTML='<div class="lv-cover"><p>Viagem aos Bálcãs</p><h1>Livro da viagem</h1><p>14 de maio a 5 de junho de 2027</p></div><div class="lv-empty"><b>Ainda não há nada para mostrar.</b><p>Faça check-ins e lance gastos durante a viagem. O livro se monta sozinho com o que estiver neste aparelho: o texto de cada lugar, as estatísticas e as curiosidades.</p></div>';return}
 /* ---- estatísticas gerais ---- */
 var rated=cks.filter(function(c){return c.rating>0}),avg=rated.length?rated.reduce(function(a,c){return a+c.rating},0)/rated.length:0;
 var order={};cks.forEach(function(c,i){order[c.id]=i});
 var rank=rated.slice().sort(function(a,b){return b.rating-a.rating||(ms(a.ts)-ms(b.ts))}),rk={};rank.forEach(function(c,i){rk[c.id]=i+1});
 var cities={},countries={},kinds={},totalKm=0,legs=[];
 cks.forEach(function(c,i){var w=where(c);if(w.city)cities[w.city]=(cities[w.city]||0)+1;if(w.country)countries[w.country]=(countries[w.country]||0)+1;if(c.kind)kinds[c.kind]=(kinds[c.kind]||0)+1;
  if(i>0&&c.lat!=null&&cks[i-1].lat!=null){var k=hav(cks[i-1].lat,cks[i-1].lon,c.lat,c.lon);if(k<1500){totalKm+=k;legs.push(k)}}});
 function phs(c){return (c.photos&&c.photos.length)?c.photos:(c.photo?[c.photo]:[])}
 var photos=cks.reduce(function(a,c){return a+phs(c).length},0),tE=0,tB=0;gs.forEach(function(e){tE+=e.eur||0;tB+=(e.brl!=null?e.brl:0)});
 var h='<div class="lv-cover"><p>Sergio e Andréa</p><h1>Bálcãs 2027</h1><p>14 de maio a 5 de junho de 2027</p><div class="lv-stats">'+
  '<div><b>'+ks.length+'</b><span>dias registrados</span></div>'+
  (cks.length?'<div><b>'+cks.length+'</b><span>lugares</span></div>':'')+
  (Object.keys(cities).length?'<div><b>'+Object.keys(cities).length+'</b><span>cidades</span></div>':'')+
  (Object.keys(countries).length?'<div><b>'+Object.keys(countries).length+'</b><span>países</span></div>':'')+
  (totalKm>=1?'<div><b>'+Math.round(totalKm)+' km</b><span>entre os lugares</span></div>':'')+
  (photos?'<div><b>'+photos+'</b><span>fotos</span></div>':'')+
  (gs.length?'<div><b>'+eur(tE)+'</b><span>gastos na viagem</span></div>':'')+'</div></div>';
 /* ---- prólogo ---- */
 if(cks.length){var ctr=Object.keys(countries);
  h+='<section class="lv-pro"><h2>Prólogo</h2><p>Esta é a história de uma viagem de carro pelos Bálcãs, de 14 de maio a 5 de junho de 2027. '+
   'Foram <b>'+cks.length+' lugares</b> registrados em <b>'+ks.length+' dia'+(ks.length>1?'s':'')+'</b>'+(ctr.length?', passando por '+ctr.length+' país'+(ctr.length>1?'es':'')+' ('+ctr.map(esc).join(', ')+')':'')+'.'+
   (rated.length?' A nota média dos lugares foi <b>'+n1(avg)+'</b> de 5.':'')+
   (rank.length?' O favorito foi <b>'+esc(rank[0].name)+'</b>'+(rank[0].rating?' ('+stars(rank[0].rating)+')':'')+'.':'')+'</p></section>'}
 var num=0;
 ks.forEach(function(d,di){var o=days[d],pl=window.DIAS&&DIAS.by?DIAS.by[d.slice(8)+'/'+d.slice(5,7)]:null;
  var dk=0,dr=o.ck.filter(function(c){return c.rating>0});for(var i=1;i<o.ck.length;i++){var a=o.ck[i-1],b=o.ck[i];if(a.lat!=null&&b.lat!=null){var k=hav(a.lat,a.lon,b.lat,b.lon);if(k<1500)dk+=k}}
  var dav=dr.length?dr.reduce(function(x,c){return x+c.rating},0)/dr.length:0;
  h+='<section class="lv-day"><div class="lv-sub">Capítulo '+(di+1)+(pl?' · Dia '+pl.n+' de '+DIAS.list.length:'')+'</div><h2>'+esc(dl(d))+'</h2>'+(pl?'<p class="lv-plan">Roteiro do dia: '+esc(pl.loc)+'</p>':'');
  if(o.ck.length){h+='<p class="lv-intro">'+(o.ck.length===1?'Um lugar registrado':o.ck.length+' lugares registrados')+(dk>=0.5?', com cerca de '+dist(dk)+' entre eles':'')+(dav?'. Nota média do dia: <b>'+n1(dav)+'</b>':'')+(o.ck.length>1&&o.ck[0].ts&&o.ck[o.ck.length-1].ts?'. Do primeiro ao último check-in, '+dur((ms(o.ck[o.ck.length-1].ts)-ms(o.ck[0].ts))/60000)+'.':'.')+'</p>'}
  o.ck.forEach(function(c){var w=where(c),i=order[c.id];num++;
   var p=[];p.push('Às <b>'+hm(c.ts)+'</b> de '+esc(wd(d))+', '+(w.txt?'em '+esc(w.txt)+', ':'')+'o check-in foi em <b>'+esc(c.name)+'</b>, o '+ord(i+1)+' lugar da viagem'+(c.kind?' ('+esc(String(c.kind).toLowerCase())+')':'')+'.');
   if(c.rating>0){var q='Sua nota foi <b>'+stars(c.rating)+'</b> ('+n1(c.rating)+'): '+label(c.rating);
    if(rated.length>2){var df=c.rating-avg;q+=', '+(Math.abs(df)<.3?'na média das suas notas ('+n1(avg)+')':df>0?'acima da média das suas notas ('+n1(avg)+')':'abaixo da média das suas notas ('+n1(avg)+')');
     q+='; é o '+ord(rk[c.id])+' mais bem avaliado de '+rated.length}
    p.push(q+'.')}
   if(i>0){var pv=cks[i-1],t=(ms(c.ts)-ms(pv.ts))/60000;
    if(c.lat!=null&&pv.lat!=null){var k=hav(pv.lat,pv.lon,c.lat,c.lon);if(k<1500&&t>0&&t<1440)p.push('Desde o lugar anterior ('+esc(pv.name)+'): '+dist(k)+' e '+dur(t)+' depois.')}
    else if(t>0&&t<1440)p.push('Foram '+dur(t)+' desde o check-in anterior.')}
   var pp=phs(c);h+='<article class="lv-ck'+(pp.length?'':' nophoto')+'">'+(pp.length?'<img src="'+pp[0]+'" alt="'+esc(c.name)+'">':'')+'<div><div class="m">'+esc(hm(c.ts))+(c.kind?' · '+esc(c.kind):'')+'</div><h3>'+esc(c.name)+(c.rating?' <span class="lv-st">'+stars(c.rating)+'</span>':'')+'</h3>'+(w.txt?'<div class="w">🌍 '+esc(w.txt)+'</div>':'')+
    '<p class="n lv-tx">'+p.join(' ')+'</p>'+(c.note?'<blockquote class="lv-q">“'+esc(c.note)+'”</blockquote>':'')+
    (pp.length>1?'<div class="lv-ph">'+pp.slice(1).map(function(u){return '<img src="'+u+'" alt="'+esc(c.name)+'">'}).join('')+'</div>':'')+(c.lat!=null?'<div class="co">📌 '+c.lat.toFixed(5)+', '+c.lon.toFixed(5)+'</div><div data-wk="'+esc(c.id)+'">'+wikiHtml(c.id)+'</div>':'')+'</div></article>';
   if(c.lat!=null&&!wiki[c.id])queue.push(c)});
  if(o.g.length){var e1=0,by={};o.g.forEach(function(e){e1+=e.eur||0;var n=cn[e.cat]||'Outros';by[n]=(by[n]||0)+(e.eur||0)});
   h+='<p class="lv-gt"><b>Gastos do dia: '+eur(e1)+'</b> · '+Object.keys(by).map(function(k){return esc(k)+' '+eur(by[k])}).join(' · ')+'</p>'}
  h+='</section>'});
 /* ---- a viagem em números ---- */
 if(cks.length){
  var top=rank.slice(0,3),dayCount={};cks.forEach(function(c){dayCount[c.date]=(dayCount[c.date]||0)+1});
  var bd=Object.keys(dayCount).sort(function(a,b){return dayCount[b]-dayCount[a]})[0];
  var dist5=[5,4,3,2,1].map(function(s){return {s:s,n:rated.filter(function(c){return Math.round(c.rating)===s}).length}});var mx=Math.max.apply(null,dist5.map(function(x){return x.n}).concat([1]));
  var kk=Object.keys(kinds).sort(function(a,b){return kinds[b]-kinds[a]}).slice(0,5);
  var cc=Object.keys(cities).sort(function(a,b){return cities[b]-cities[a]}).slice(0,5);
  h+='<section class="lv-tot"><h2 style="margin:0 0 8px;font:700 1.3rem var(--f-display)">A viagem em números</h2><table>'+
   '<tr><td>Lugares registrados</td><td>'+cks.length+'</td></tr><tr><td>Dias com registro</td><td>'+ks.length+'</td></tr>'+
   (bd?'<tr><td>Dia com mais lugares</td><td>'+esc(wd(bd))+', '+bd.slice(8)+'/'+bd.slice(5,7)+' · '+dayCount[bd]+'</td></tr>':'')+
   (totalKm>=1?'<tr><td>Distância entre check-ins</td><td>'+Math.round(totalKm)+' km</td></tr>':'')+
   (legs.length?'<tr><td>Maior salto entre dois lugares</td><td>'+dist(Math.max.apply(null,legs))+'</td></tr>':'')+
   (rated.length?'<tr><td>Nota média</td><td>'+n1(avg)+' / 5</td></tr>':'')+
   (cc.length?'<tr><td>Cidades com mais check-ins</td><td>'+cc.map(function(k){return esc(k)+' ('+cities[k]+')'}).join(', ')+'</td></tr>':'')+
   (kk.length?'<tr><td>Tipos de lugar</td><td>'+kk.map(function(k){return esc(k)+' ('+kinds[k]+')'}).join(', ')+'</td></tr>':'')+
   '</table>'+
   (top.length?'<h3 style="margin:16px 0 6px;font:700 1.05rem var(--f-display)">Os favoritos</h3><ol class="lv-fav">'+top.map(function(c){return '<li><b>'+esc(c.name)+'</b> <span class="lv-st">'+stars(c.rating)+'</span> <small>'+esc(where(c).txt)+'</small></li>'}).join('')+'</ol>':'')+
   (rated.length?'<h3 style="margin:16px 0 6px;font:700 1.05rem var(--f-display)">Como você avaliou</h3><div class="lv-bars">'+dist5.map(function(x){return '<div><span>'+x.s+' ★</span><i style="width:'+Math.round(x.n/mx*100)+'%"></i><b>'+x.n+'</b></div>'}).join('')+'</div>':'')+
   '</section>'}
 if(gs.length){var byc={};gs.forEach(function(e){var n=cn[e.cat]||'Outros';byc[n]=(byc[n]||0)+(e.eur||0)});
  h+='<section class="lv-tot"><h2 style="margin:0 0 6px;font:700 1.2rem var(--f-display)">Resumo dos gastos</h2><table>'+Object.keys(byc).sort(function(a,b){return byc[b]-byc[a]}).map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+eur(byc[k])+'</td></tr>'}).join('')+'<tr><td><b>Total</b></td><td><b>'+eur(tE)+(tB?' · '+brl(tB):'')+'</b></td></tr></table></section>'}
 el.innerHTML=h;pump()}
document.getElementById('lv-print').onclick=function(){window.print()};
if(window.CK)CK.onChange(render);render();
})();
</script></body></html>
