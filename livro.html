 var ks=Object.keys(days).sort();
 if(!ks.length){el.innerHTML='<div class="lv-cover"><p>Viagem aos Bálcãs</p><h1>Livro da viagem</h1><p>14 de maio a 5 de junho de 2027</p></div><div class="lv-empty"><b>Ainda não há nada para mostrar.</b><p>Faça check-ins e lance gastos durante a viagem. O livro se monta sozinho com o que estiver neste aparelho.</p></div>';return}
 var places=cks.length,photos=cks.filter(function(c){return c.photo}).length,cities={};
 cks.forEach(function(c){var w=where(c).split(',')[0].trim();if(w)cities[w]=1});
 var tE=0,tB=0;gs.forEach(function(e){tE+=e.eur||0;tB+=(e.brl!=null?e.brl:0)});
 var h='<div class="lv-cover"><p>Sergio e Andréa</p><h1>Bálcãs 2027</h1><p>14 de maio a 5 de junho de 2027</p><div class="lv-stats">'+
  '<div><b>'+ks.length+'</b><span>dias registrados</span></div>'+
  (places?'<div><b>'+places+'</b><span>lugares</span></div>':'')+
  (Object.keys(cities).length?'<div><b>'+Object.keys(cities).length+'</b><span>cidades</span></div>':'')+
  (photos?'<div><b>'+photos+'</b><span>fotos</span></div>':'')+
  (gs.length?'<div><b>'+eur(tE)+'</b><span>gastos na viagem</span></div>':'')+'</div></div>';
 ks.forEach(function(d){var o=days[d],pl=window.DIAS&&DIAS.by?DIAS.by[d.slice(8)+'/'+d.slice(5,7)]:null;
  h+='<section class="lv-day"><div class="lv-sub">'+(pl?'Dia '+pl.n+' de '+DIAS.list.length:'')+'</div><h2>'+esc(dl(d))+'</h2>'+(pl?'<p class="lv-plan">Roteiro: '+esc(pl.loc)+'</p>':'');
  o.ck.forEach(function(c){var w=where(c);
   h+='<article class="lv-ck'+(c.photo?'':' nophoto')+'">'+(c.photo?'<img src="'+c.photo+'" alt="'+esc(c.name)+'">':'')+'<div><div class="m">'+esc(String(c.ts).slice(11,16))+(c.kind?' · '+esc(c.kind):'')+(c.stairs===0?' · ♿ sem escada':c.stairs===1?' · 🪜 poucos degraus':c.stairs===2?' · 🪜 muita escada':'')+'</div><h3>'+esc(c.name)+(c.rating?' <span class="lv-st">'+stars(c.rating)+'</span>':'')+'</h3>'+(w?'<div class="w">🌍 '+esc(w)+'</div>':'')+(c.note?'<p class="n">'+esc(c.note)+'</p>':'')+(c.lat!=null?'<div class="co">📌 '+c.lat.toFixed(5)+', '+c.lon.toFixed(5)+'</div>':'')+'</div></article>'});
  if(o.g.length){var e1=0,by={};o.g.forEach(function(e){e1+=e.eur||0;var n=cn[e.cat]||'Outros';by[n]=(by[n]||0)+(e.eur||0)});
   h+='<p class="lv-gt"><b>Gastos do dia: '+eur(e1)+'</b> · '+Object.keys(by).map(function(k){return esc(k)+' '+eur(by[k])}).join(' · ')+'</p>'}
  h+='</section>'});
 if(gs.length){var byc={};gs.forEach(function(e){var n=cn[e.cat]||'Outros';byc[n]=(byc[n]||0)+(e.eur||0)});
  h+='<section class="lv-tot"><h2 style="margin:0 0 6px;font:700 1.2rem var(--f-display)">Resumo dos gastos</h2><table>'+Object.keys(byc).sort(function(a,b){return byc[b]-byc[a]}).map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+eur(byc[k])+'</td></tr>'}).join('')+'<tr><td><b>Total</b></td><td><b>'+eur(tE)+(tB?' · '+brl(tB):'')+'</b></td></tr></table></section>'}
 el.innerHTML=h}
document.getElementById('lv-print').onclick=function(){window.print()};
if(window.CK)CK.onChange(render);render();
})();
</script></body></html>
