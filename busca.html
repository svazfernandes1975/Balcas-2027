<script>
(function(){
var IDX=null,ROWS=[],PG=[],Q='',RES=[],GR=[],FEAT=null,SHOW=10,PF=-1;
function $(s){return document.querySelector(s)}
function nz(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lsGet(){try{return JSON.parse(localStorage.getItem('balcas-busca')||'[]')}catch(e){return[]}}
function lsAdd(q){try{var l=lsGet().filter(function(x){return x!==q});l.unshift(q);localStorage.setItem('balcas-busca',JSON.stringify(l.slice(0,6)))}catch(e){}}
var POP=['Postojna','Plitvice','vinheta','estacionamento','farmácia','gasolina','Pletna','aluguel do carro','sem escada','fronteira'];
function load(cb){
  if(IDX)return cb();
  fetch('search-index.json?v=202').then(function(r){return r.json()}).then(function(d){
    IDX=d;PG=d.pages;ROWS=d.rows.map(function(r){var t=r[2];return{p:r[0],h:r[1],t:t,a:r[3],n:nz(t),nh:nz(r[1])}});cb()
  }).catch(function(){$('#bst').textContent='Não consegui carregar o índice da busca. Abra o site com internet uma vez e tente de novo.'});
}
function terms(q){return nz(q).split(/\s+/).filter(Boolean)}
function run(q){
  var T=terms(q),phrase=nz(q).replace(/\s+/g,' ').trim(),out=[];
  if(phrase.length<2)return out;
  ROWS.forEach(function(r,i){
    var pt=nz(PG[r.p][1]),sc=0,own=0;
    for(var k=0;k<T.length;k++){var t=T[k],c=0,pos=r.n.indexOf(t);
      if(pos<0&&r.nh.indexOf(t)<0&&pt.indexOf(t)<0)return;
      if(pos>=0)own++;
      while(pos>=0&&c<3){c++;pos=r.n.indexOf(t,pos+t.length)}
      sc+=c+(r.nh.indexOf(t)>=0?2:0)+(pt.indexOf(t)>=0?1:0)}
    /* ao menos uma palavra tem de estar no próprio trecho; se o resto vem só do título da seção ou da página, o trecho precisa ter conteúdo de verdade */
    if(own===0||(own<T.length&&r.t.length<60))return;
    if(T.length>1&&r.n.indexOf(phrase)>=0)sc+=4;
    if(r.t.length<220)sc+=1;
    out.push({r:r,s:sc,i:i})});
  out.sort(function(a,b){return b.s-a.s||a.i-b.i});
  return out;
}
function seg0(t){var i=t.indexOf(' · ');return i<0?t:t.slice(0,i)}
function isHead(r){return !!r.h&&r.h===r.t.slice(0,120)}
function cut(s,n){return s.length>n?s.slice(0,n-1).replace(/\s+\S*$/,'')+'…':s}
function titleOf(r){
  var s=seg0(r.t);
  if(r.t.indexOf(' · ')>=0&&s.length<=50)return s;
  if(isHead(r))return cut(r.t,90);
  if(r.h)return cut(r.h,90);
  return cut(r.t,70);
}
function descSrc(r){var s=seg0(r.t);return(r.t.indexOf(' · ')>=0&&s.length<=50)?r.t.slice(s.length+3):(isHead(r)?'':r.t)}
function marks(text,T){
  var n=nz(text),rg=[];
  if(n.length!==text.length)return esc(text);
  T.forEach(function(t){var p=n.indexOf(t);while(p>=0){rg.push([p,p+t.length]);p=n.indexOf(t,p+t.length)}});
  rg.sort(function(a,b){return a[0]-b[0]});
  var m=[];rg.forEach(function(x){var l=m[m.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else m.push(x.slice())});
  var h='',p=0;m.forEach(function(x){h+=esc(text.slice(p,x[0]))+'<b>'+esc(text.slice(x[0],x[1]))+'</b>';p=x[1]});

/* trecho curto em volta do primeiro termo + fragmento (de uma célula só) para a página achar o ponto exato */
function snip(text,T,wide){
  var n=nz(text),first=-1;
  T.forEach(function(x){var p=n.indexOf(x);if(p>=0&&(first<0||p<first))first=p});
  var hit=first>=0;if(first<0)first=0;
  var s=Math.max(0,first-(wide?90:70)),e=Math.min(text.length,first+(wide?230:170));
  if(s>0){var sp=text.indexOf(' ',s);if(sp>=0&&sp<first)s=sp+1}
  if(e<text.length){var sp2=text.lastIndexOf(' ',e);if(sp2>first)e=sp2}
  var seg=text.slice(s,e),pre=s>0?'… ':'',post=e<text.length?' …':'';

function link(r,q,T){

function path(r,title){

function sameRow(a,b){return titleOf(a)===titleOf(b)&&descSrc(a)===descSrc(b)}
function build(){
  var T=terms(Q),phrase=nz(Q).replace(/\s+/g,' ').trim();
  FEAT=null;

  }
  var list=RES.filter(function(x){return x!==FEAT&&(PF<0||x.r.p===PF)});
  if(PF>=0){GR=list.map(function(x){return{p:PF,rows:[x],flat:true}});return}
  var by={},ord=[];
  list.forEach(function(x){var p=x.r.p;if(!by[p]){by[p]=[];ord.push(p)}by[p].push(x)});
  GR=ord.map(function(p){
    var l=by[p],pt=nz(PG[p][1]),tb=T.every(function(t){return pt.indexOf(t)>=0})?3:0,uniq=[],heads={};
    /* uma linha de conteúdo já leva o título da seção; o título solto só entra se a seção não tiver outro trecho achado */
    l.forEach(function(x){if(!isHead(x.r)&&x.r.h)heads[nz(x.r.h)]=1});
    l=l.filter(function(x){return !(isHead(x.r)&&heads[nz(x.r.h)])});
    var rich=l.filter(function(x){return !isHead(x.r)&&descSrc(x.r).length>=25}),thin=l.filter(function(x){return !isHead(x.r)&&descSrc(x.r).length<25}),hd=l.filter(function(x){return isHead(x.r)});
    l=rich.concat(thin,hd);
    l.forEach(function(x){if(!uniq.some(function(u){return sameRow(u.r,x.r)}))uniq.push(x)});
    /* os dois trechos de destaque abaixo do principal não repetem título */
    var seen={},front=[],back=[];
    uniq.forEach(function(x,i){var k=nz(titleOf(x.r));if(front.length<3&&!seen[k]){seen[k]=1;front.push(x)}else back.push(x)});
    uniq=front.concat(back);
    return{p:p,rows:uniq,score:l[0].s+Math.min(l.length,10)*0.3+tb}}).sort(function(a,b){return b.score-a.score});
}
function more(g,T){
  return g.rows.slice(3).map(function(x){return '<li>'+item(x.r,T)+'</li>'}).join('');
}
function render(){
  var T=terms(Q),ul=$('#rl'),bm=$('#bmore'),bs=$('#bsug'),bp=$('#bpg');
  ul.innerHTML='';bs.innerHTML='';
  if(nz(Q).trim().length<2){
    $('#bst').textContent='';bp.hidden=true;bm.hidden=true;
    var rec=lsGet(),h='';
    if(rec.length)h+='<h2>Buscas recentes</h2><div class="chips">'+rec.map(function(x){return '<button type="button" data-q="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>';
    h+='<h2>Sugestões</h2><div class="chips">'+POP.map(function(x){return '<button type="button" data-q="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>';
    bs.innerHTML=h;return;
  }
  var pc={};RES.forEach(function(x){pc[x.r.p]=(pc[x.r.p]||0)+1});
  var np=Object.keys(pc).length;
  $('#bst').textContent=RES.length?('Cerca de '+RES.length+(RES.length>1?' resultados':' resultado')+(np>1?' em '+np+' páginas':'')):'Nada encontrado para “'+Q+'”.';
  if(!RES.length){bp.hidden=true;bm.hidden=true;bs.innerHTML='<p class="prose">Tente menos palavras ou outra grafia (por exemplo, o nome do lugar sem “de” ou “do”).</p><div class="chips">'+POP.map(function(x){return '<button type="button" data-q="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>';return}
  if(np>1){
    var ids=Object.keys(pc).map(Number).sort(function(a,b){return pc[b]-pc[a]});
    bp.innerHTML='<button type="button" role="tab" data-pf="-1" aria-selected="'+(PF<0)+'">Todas<small>'+RES.length+'</small></button>'+ids.map(function(i){return '<button type="button" role="tab" data-pf="'+i+'" aria-selected="'+(PF===i)+'">'+esc(PG[i][1])+'<small>'+pc[i]+'</small></button>'}).join('');bp.hidden=false;
  }else bp.hidden=true;
  var html='';
  if(FEAT)html+='<li class="g-top">'+item(FEAT.r,T,{top:true})+'</li>';
  GR.slice(0,SHOW).forEach(function(g,gi){
    if(g.flat){html+='<li>'+item(g.rows[0].r,T)+'</li>';return}
    var p=g.rows[0];
    html+='<li class="g">'+item(p.r,T,{top:true});
    var sub=g.rows.slice(1,3);
    if(sub.length)html+='<ul class="g-sub">'+sub.map(function(x){return '<li>'+item(x.r,T)+'</li>'}).join('')+'</ul>';
    var rest=g.rows.length-3;
    if(rest>0)html+='<ul class="g-sub" data-ex="'+gi+'" hidden></ul><button type="button" class="g-more" data-gi="'+gi+'" aria-expanded="false">mais '+rest+(rest>1?' trechos':' trecho')+' nesta página</button>';
    html+='</li>'});
  ul.innerHTML=html;
  bm.hidden=GR.length<=SHOW;
}
function search(q){
  Q=q.trim();PF=-1;SHOW=10;
  load(function(){RES=run(Q);build();render();
    try{history.replaceState(null,'',Q?'busca.html?q='+encodeURIComponent(Q):'busca.html')}catch(e){}});
}
var tm=0,inp=$('#bq');
inp.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){search(inp.value)},180)});
$('#bf').addEventListener('submit',function(e){e.preventDefault();clearTimeout(tm);var q=inp.value.trim();search(q);if(q.length>=2)lsAdd(q);if(document.activeElement)document.activeElement.blur()});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-q]');if(b&&b.tagName==='BUTTON'){inp.value=b.dataset.q;search(b.dataset.q);lsAdd(b.dataset.q);return}
  var f=e.target.closest('[data-pf]');if(f){PF=+f.dataset.pf;SHOW=PF<0?10:15;build();render();return}
  if(e.target.closest('#bmore')){SHOW+=PF<0?10:15;render();return}
  var gm=e.target.closest('.g-more');if(gm){
    var gi=+gm.dataset.gi,ex=document.querySelector('[data-ex="'+gi+'"]'),open=gm.getAttribute('aria-expanded')==='true',g=GR[gi],T=terms(Q);
    if(!open){ex.innerHTML=more(g,T);ex.hidden=false;gm.setAttribute('aria-expanded','true');gm.textContent='mostrar menos'}
    else{ex.hidden=true;ex.innerHTML='';gm.setAttribute('aria-expanded','false');var rest=g.rows.length-3;gm.textContent='mais '+rest+(rest>1?' trechos':' trecho')+' nesta página'}
    return}
  var a=e.target.closest('a[data-go]');if(a&&Q.length>=2)lsAdd(Q);
});
var q0=new URLSearchParams(location.search).get('q')||'';
inp.value=q0;
load(function(){Q=q0.trim();RES=run(Q);build();render();if(!Q)inp.focus()});
})();
