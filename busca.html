<p class="foot">A busca vale para o texto das páginas do roteiro (não inclui gastos, diário e dados que ficam só no seu aparelho). Ignora acentos e maiúsculas, e mostra só os trechos que têm todas as palavras digitadas.</p>

<script>
(function(){
var IDX=null,ROWS=[],PG=[],Q='',RES=[],SHOW=30,PF=-1;
function $(s){return document.querySelector(s)}
function nz(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lsGet(){try{return JSON.parse(localStorage.getItem('balcas-busca')||'[]')}catch(e){return[]}}
function lsAdd(q){try{var l=lsGet().filter(function(x){return x!==q});l.unshift(q);localStorage.setItem('balcas-busca',JSON.stringify(l.slice(0,6)))}catch(e){}}
var POP=['Postojna','Plitvice','vinheta','estacionamento','farmácia','gasolina','Pletna','aluguel do carro','sem escada','fronteira'];
function load(cb){
  if(IDX)return cb();
  fetch('search-index.json?v=193').then(function(r){return r.json()}).then(function(d){
    IDX=d;PG=d.pages;ROWS=d.rows.map(function(r){var t=r[2];return{p:r[0],h:r[1],t:t,a:r[3],n:nz(t),nh:nz(r[1])}});cb()
  }).catch(function(){$('#bst').textContent='Não consegui carregar o índice da busca. Abra o site com internet uma vez e tente de novo.'});
}
function terms(q){return nz(q).split(/\s+/).filter(Boolean)}
function run(q){
  var T=terms(q),phrase=nz(q).replace(/\s+/g,' ').trim(),out=[];
  if(phrase.length<2)return out;
  ROWS.forEach(function(r,i){
    var pt=nz(PG[r.p][1]),sc=0;
    for(var k=0;k<T.length;k++){var t=T[k],c=0,pos=r.n.indexOf(t);
      if(pos<0&&r.nh.indexOf(t)<0&&pt.indexOf(t)<0)return;
      while(pos>=0&&c<3){c++;pos=r.n.indexOf(t,pos+t.length)}
      sc+=c+(r.nh.indexOf(t)>=0?2:0)+(pt.indexOf(t)>=0?1:0)}
    if(T.length>1&&r.n.indexOf(phrase)>=0)sc+=4;
    if(r.t.length<220)sc+=1;
    out.push({r:r,s:sc,i:i})});
  out.sort(function(a,b){return b.s-a.s||a.i-b.i});
  return out;
}
function marks(text,T){
  var n=nz(text),rg=[];
  if(n.length!==text.length)return esc(text);
  T.forEach(function(t){var p=n.indexOf(t);while(p>=0){rg.push([p,p+t.length]);p=n.indexOf(t,p+t.length)}});
  rg.sort(function(a,b){return a[0]-b[0]});
  var m=[];rg.forEach(function(x){var l=m[m.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else m.push(x.slice())});
  var h='',p=0;m.forEach(function(x){h+=esc(text.slice(p,x[0]))+'<mark>'+esc(text.slice(x[0],x[1]))+'</mark>';p=x[1]});
  return h+esc(text.slice(p));
}
function snippet(r,T){
  var t=r.t,n=r.n,first=-1;
  T.forEach(function(x){var p=n.indexOf(x);if(p>=0&&(first<0||p<first))first=p});
  if(first<0)first=0;
  var s=Math.max(0,first-90),e=Math.min(t.length,first+190);
  if(s>0){var sp=t.indexOf(' ',s);if(sp>=0&&sp<first)s=sp+1}
  if(e<t.length){var sp2=t.lastIndexOf(' ',e);if(sp2>first)e=sp2}
  var seg=t.slice(s,e),pre=s>0?'… ':'',post=e<t.length?' …':'';
  /* fragmento curto, de uma célula só, para a página achar o ponto exato */
  var cs=t.lastIndexOf(' · ',first);cs=cs<0?0:cs+3;var ce=t.indexOf(' · ',first);if(ce<0)ce=t.length;
  var fs=Math.max(cs,first-30),fe=Math.min(ce,first+50);
  return{html:pre+marks(seg,T)+post,frag:t.slice(fs,fe).trim()};
}
function link(r,q,frag){
  var f=PG[r.p][0];
  return f+'?hl='+encodeURIComponent(q)+'&b='+encodeURIComponent(frag)+(r.a?'#'+encodeURIComponent(r.a):'');
}
function render(){
  var q=Q,T=terms(q),list=PF<0?RES:RES.filter(function(x){return x.r.p===PF});
  var ul=$('#rl'),bm=$('#bmore'),bs=$('#bsug'),bp=$('#bpg');
  ul.innerHTML='';bs.innerHTML='';
  if(nz(q).trim().length<2){
    $('#bst').textContent='';bp.hidden=true;bm.hidden=true;
    var rec=lsGet(),h='';
    if(rec.length)h+='<h2>Buscas recentes</h2><div class="chips">'+rec.map(function(x){return '<button type="button" data-q="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>';
    h+='<h2>Sugestões</h2><div class="chips">'+POP.map(function(x){return '<button type="button" data-q="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>';
    bs.innerHTML=h;return;
  }
  var pc={};RES.forEach(function(x){pc[x.r.p]=(pc[x.r.p]||0)+1});
  var np=Object.keys(pc).length;
  $('#bst').textContent=RES.length?(RES.length+(RES.length>1?' trechos':' trecho')+' em '+np+(np>1?' páginas':' página')):'Nada encontrado para “'+q+'”.';
  if(!RES.length){bp.hidden=true;bm.hidden=true;bs.innerHTML='<p class="prose">Tente menos palavras ou outra grafia (por exemplo, o nome do lugar sem “de” ou “do”).</p><div class="chips">'+POP.map(function(x){return '<button type="button" data-q="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>';return}
  if(np>1){
    var ids=Object.keys(pc).map(Number).sort(function(a,b){return pc[b]-pc[a]});
    bp.innerHTML='<button type="button" data-pf="-1" aria-pressed="'+(PF<0)+'">Todas</button>'+ids.map(function(i){return '<button type="button" data-pf="'+i+'" aria-pressed="'+(PF===i)+'">'+esc(PG[i][1])+'<small>'+pc[i]+'</small></button>'}).join('');bp.hidden=false;
  }else bp.hidden=true;
  var shown=list.slice(0,SHOW);
  ul.innerHTML=shown.map(function(x){var r=x.r,sn=snippet(r,T);
    return '<li class="rs"><div class="rs-top"><span class="rs-pg">'+esc(PG[r.p][1])+'</span>'+(r.h&&r.h!==r.t.slice(0,r.h.length)?'<span class="rs-h">'+esc(r.h)+'</span>':'')+'</div><p class="rs-t">'+sn.html+'</p><a class="rs-go" href="'+esc(link(r,q,sn.frag))+'" data-q="">Abrir na página</a></li>'}).join('');
  bm.hidden=list.length<=SHOW;
}
function go(q,push){
  Q=q.trim();PF=-1;SHOW=30;
  load(function(){RES=run(Q);render();
    if(Q.length>=2&&RES.length)lsAdd(Q);
    try{history.replaceState(null,'',Q?'busca.html?q='+encodeURIComponent(Q):'busca.html')}catch(e){}});
}
var tm=0,inp=$('#bq');
inp.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){Q=inp.value.trim();PF=-1;SHOW=30;load(function(){RES=run(Q);render();try{history.replaceState(null,'',Q?'busca.html?q='+encodeURIComponent(Q):'busca.html')}catch(e){}})},180)});
$('#bf').addEventListener('submit',function(e){e.preventDefault();clearTimeout(tm);go(inp.value)});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-q]');if(b&&b.tagName==='BUTTON'){inp.value=b.dataset.q;go(b.dataset.q);inp.focus();return}
  var f=e.target.closest('[data-pf]');if(f){PF=+f.dataset.pf;SHOW=30;render();return}
  if(e.target.closest('#bmore')){SHOW+=30;render()}
  var a=e.target.closest('a.rs-go');if(a&&Q.length>=2)lsAdd(Q);
});
